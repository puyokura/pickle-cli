[package]
name = "pickle-cli"
version = "0.1.0"
edition = "2021"
description = "Terminal client and MCP server for Pickle"
license = "AGPL-3.0-or-later"
repository = "https://github.com/puyokura/pickle-cli"
readme = "README.md"
keywords = ["pickle", "cli", "mcp", "chat"]
categories = ["command-line-utilities"]

[[bin]]
name = "pickle"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "io-util", "net", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
